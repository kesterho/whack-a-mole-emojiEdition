<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emoji Whack 🐹</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <main>
    <header class="hero">
      <h1>Emoji <span class="accent">Whack</span> 🐹</h1>
      <p class="tagline">Click the emoji before it vanishes. 30 seconds. Don't miss.</p>
    </header>

    <section class="hud">
      <div class="hud-item">
        <span class="hud-label">Score</span>
        <div class="score-wrap">
          <span class="hud-value" id="score">0</span>
          <span class="score-delta" id="score-delta" aria-live="polite"></span>
        </div>
      </div>
      <div class="hud-item">
        <span class="hud-label">Time</span>
        <span class="hud-value" id="time">30</span>
      </div>
    </section>

    <section class="difficulty" aria-label="Choose difficulty">
      <button class="difficulty-btn is-active" data-level="easy" type="button">Easy</button>
      <button class="difficulty-btn" data-level="hard" type="button">Hard</button>
      <button class="difficulty-btn" data-level="challenging" type="button">Challenging</button>
    </section>

    <section id="duration-controls" class="duration" aria-label="Choose game duration">
      <span class="duration-label">Round length</span>
      <div class="duration-custom">
        <label for="custom-duration" class="duration-custom-label">Custom</label>
        <input id="custom-duration" class="duration-input" type="number" min="5" max="300" step="1" value="30" inputmode="numeric" aria-label="Custom round length in seconds">
        <button id="set-duration" class="duration-set-btn" type="button">Set</button>
      </div>
    </section>

    <section id="grid" class="grid"></section>

    <section class="play-mode" aria-label="Choose play mode">
      <button class="mode-btn is-active" data-mode="casual" type="button">Casual Play</button>
      <button class="mode-btn" data-mode="ranked" type="button">Ranked Play</button>
    </section>

    <section class="player-profile" aria-label="Player profile">
      <span class="profile-label">Player tag</span>
      <div class="profile-main">
        <input
          id="player-name-input"
          class="profile-name-input"
          type="text"
          maxlength="20"
          autocomplete="nickname"
          spellcheck="false"
          value="guest"
          aria-label="Player username"
          aria-describedby="profile-name-hint"
        >
        <button id="save-name" class="profile-btn" type="button">Save</button>
      </div>
      <p id="profile-name-hint" class="profile-hint" aria-live="polite">Your ranked runs use this name.</p>
    </section>

    <div class="controls">
      <button id="start" class="start-btn">Start</button>
      <button id="stop" class="stop-btn" disabled>Stop</button>
    </div>

    <section id="leaderboard" class="leaderboard is-locked" aria-label="Ranked leaderboard">
      <div class="lb-head">
        <h2 class="lb-title">Ranked Leaderboard</h2>
        <p id="lb-status" class="lb-status" aria-live="polite">Ranked mode only</p>
      </div>
      <ol id="lb-list" class="lb-list">
        <li class="lb-empty">Switch to Ranked Play to view top scores.</li>
      </ol>
    </section>

    <footer class="note">
      built with <code>setInterval</code> · <code>Math.random</code> · a lot of caffeine
    </footer>
  </main>

  <script type="module" src="script/script.js"></script>
</body>
</html>
